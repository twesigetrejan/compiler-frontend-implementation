<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AST — x = 10; y = x + 5; z=2+y</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #eef0f3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    min-height: 100vh;
  }

  /* ── Banner ── */
  .banner {
    background: #1a1a2e;
    color: #ddd;
    padding: 22px 36px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .banner h1 {
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    letter-spacing: .4px;
  }
  .banner .meta {
    font-size: 13px;
    color: #999;
  }
  .banner .meta span {
    background: #2d2d4a;
    color: #e0e0ff;
    font-family: "Courier New", monospace;
    font-size: 13px;
    padding: 2px 10px;
    border-radius: 4px;
    border: 1px solid #44447a;
  }

  /* ── Layout ── */
  .container {
    display: flex;
    flex-wrap: wrap;
    gap: 28px;
    padding: 32px 36px;
    align-items: flex-start;
  }

  /* ── Cards ── */
  .card {
    background: #fff;
    border-radius: 14px;
    padding: 20px 22px;
    box-shadow: 0 2px 14px rgba(0,0,0,.09);
    display: inline-flex;
    flex-direction: column;
    gap: 14px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 600;
    color: #666;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .card-expr {
    background: #f5f5f5;
    color: #c0392b;
    font-family: "Courier New", monospace;
    font-size: 13px;
    padding: 2px 10px;
    border-radius: 5px;
    font-weight: 500;
  }

  /* ── Legend ── */
  .legend {
    padding: 0 36px 28px;
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #555;
  }
  .legend-circle {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: #fff;
    display: inline-block;
    flex-shrink: 0;
  }
  .legend-circle.op   { border: 3px solid #1a1a2e; }
  .legend-circle.val  { border: 2px solid #555; }
  .legend-circle.stmt { border: 2.5px solid #2c3e50; }
</style>
</head>

</div>
